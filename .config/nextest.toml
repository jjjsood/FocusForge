# The default profile's per-test kill, 15 minutes, so a hang ends as a named
# TIMEOUT instead of a silent wait. Measured slowest test:
# `queued_tab_runs_past_a_keep_question`, 405 s on windows-2022.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 15 }

# `stack_cli` spawns whole aligned laplacian stacks through the debug binary:
# 42 s locally and 144-245 s on windows-2022, but one windows-2022 run took
# `stack_output_carries_the_auto_crop` to 860 s and killed
# `stack_aligns_before_fusing` at 900 s while unrelated in-process tests
# slowed 5-16x and the align-only tests beside them ran at their usual speed.
# 30 minutes for this binary.
[[profile.default.overrides]]
filter = 'binary_id(focusforge-cli::stack_cli)'
slow-timeout = { period = "60s", terminate-after = 30 }

# The GPU parity suite: one test at a time (they share one device), a SLOW
# line every minute so a long test is told apart from a hung one, and a
# per-test kill so a hang ends as a named TIMEOUT instead of a silent wait.
# The longest test, the whole-pipeline stack parity (CPU and GPU pipelines
# over two label plans, then the near-tie proof), takes about 5 minutes, so
# the 20-minute kill leaves it a fourfold margin.
[profile.gpu]
test-threads = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }

[profile.gpu.junit]
path = "junit.xml"

# The fast workspace run `tools/check-all.sh --quick` uses. Any test running
# past 180 s ends as a named TIMEOUT: the slowest test of this profile measured
# 72.1 s under the gate's parallel load (`align_cli
# write_warped_writes_one_tiff_per_frame_and_times_it`), so 180 s is 2.5x that.
# An override rather than a base `slow-timeout`, because the default profile's
# `stack_cli` override above would win over a base setting.
[[profile.quick.overrides]]
filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 3 }

# Left to the full gate, one reason per binary:
#   align_parallel_memory: peak heap of the parallel aligner (counting allocator).
#   align_reference_cache: pyramid reads and per-frame outcomes of real aligner runs.
#   tile_scheduler_memory: peak in-flight tile memory (counting allocator).
#   checkpoint_render_memory: peak memory of a full-size checkpoint render and encode.
# Left to the full gate, one reason per test:
#   align_parallel `output_is_identical_across_worker_counts_and_budgets`: 14 aligner
#   runs at the shipped defaults over mantis-512 (chain and anchor, four worker
#   counts and three budgets each), 185 s in a debug build.
[profile.quick]
default-filter = '''
not (
  (binary_id(focusforge-core::align_parallel) & test(=output_is_identical_across_worker_counts_and_budgets))
  | binary_id(focusforge-core::align_parallel_memory)
  | binary_id(focusforge-core::align_reference_cache)
  | binary_id(focusforge-core::tile_scheduler_memory)
  | binary_id(focusforge-core::checkpoint_render_memory)
)
'''
