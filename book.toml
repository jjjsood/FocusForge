#
# The FocusForge user manual. Build with `mdbook build` from the repository root;
# the output lands in book/, which is not committed.

[book]
title = "FocusForge Manual"
authors = ["The FocusForge project"]
description = "Focus stacking in practice, and every function of the FocusForge window."
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/FocusForge/"
git-repository-url = "https://github.com/jjjsood/FocusForge"
edit-url-template = "https://github.com/jjjsood/FocusForge/edit/develop/{path}"
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = ["theme/focusforge.css"]
additional-js = ["theme/focusforge.js"]

# Chapters with sub-chapters fold; the path to the open page stays expanded.
[output.html.fold]
enable = true
level = 0

[output.html.search]
limit-results = 30
