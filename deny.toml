# GPLv3-compatible license allowlist, current SPDX spelling.
#
# Slint's own license expression -- `GPL-3.0-only OR
# LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0` (same
# for every `i-slint-*` crate) -- is satisfied by the `GPL-3.0-only` arm
# alone, already allowed below.
[licenses]
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-2.1-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",       # foldhash, slotmap (wgpu-hal tree)
    "ISC",        # libloading (wgpu-hal tree)
    "CC0-1.0",    # hexf-parse (naga, via wgpu)
]

[[licenses.exceptions]]
name = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["MIT", "Apache-2.0", "NCSA"]

# Three RUSTSEC advisories are reached only through Slint's own transitive
# dependency tree; each advisory itself states "no safe upgrade available", so
# there is nothing to fix from this side. Ignored here rather than silently
# failing the gate on a morning when nothing in this workspace changed;
# revisit on any Slint version bump.
[advisories]
ignore = [
    # paste v1.0.15, via paste -> pulp -> exr -> image ->
    # (i-slint-compiler, i-slint-core, slint) -> focusforge-gui
    { id = "RUSTSEC-2024-0436", reason = "no safe upgrade available -- tracked upstream, revisit on any Slint version bump" },
    # rustybuzz v0.20.1, via rustybuzz -> usvg -> resvg ->
    # (i-slint-common, i-slint-compiler, i-slint-core) -> focusforge-gui
    { id = "RUSTSEC-2026-0206", reason = "no safe upgrade available -- tracked upstream, revisit on any Slint version bump" },
    # ttf-parser v0.25.1, via ttf-parser -> fontdb -> usvg -> resvg ->
    # (i-slint-common, i-slint-compiler, i-slint-core) -> focusforge-gui
    { id = "RUSTSEC-2026-0192", reason = "no safe upgrade available -- tracked upstream, revisit on any Slint version bump" },
]

# The wgpu major is pinned to 29 by Slint's `unstable-wgpu-29`
# (crates/gpu/src/lib.rs). A blanket `[bans] multiple-versions = "deny"` is
# deliberately not used: Cargo.lock already carries unrelated duplicate
# versions of foldhash, hashbrown, jni-sys and syn, and a blanket policy
# would demand a growing skip list maintained for that churn -- exactly
# where a real wgpu duplication would eventually be silenced. This targeted
# form fails the gate by name on a second wgpu major, with no collateral.
[[bans.deny]]
name = "wgpu"
deny-multiple-versions = true
