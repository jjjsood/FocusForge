# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the user manual from docs/ with a pinned mdBook on every branch push and pull
# request, and publishes it to GitHub Pages on a push to main. Publishing needs the
# repository's Pages source set to "GitHub Actions" (Settings -> Pages) once.

name: book

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    env:
      MDBOOK_VERSION: v0.5.4
      # GitHub asset digest of mdbook-v0.5.4-x86_64-unknown-linux-musl.tar.gz.
      MDBOOK_SHA256: 5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned mdBook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool_dir="$RUNNER_TEMP/mdbook"
          mkdir -p "$tool_dir"
          archive="$tool_dir/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          python3 -I tools/lib/download.py \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/$(basename "$archive")" "$archive"
          echo "${MDBOOK_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Build the book
        run: |
          mdbook --version
          mdbook build 2>&1 | tee "$RUNNER_TEMP/mdbook.log"
          if grep -E '(WARN|ERROR)' "$RUNNER_TEMP/mdbook.log"; then
            echo "mdBook reported warnings or errors" >&2
            exit 1
          fi
      - name: Check relative links
        run: python3 -I tools/check-book-links.py book
      - name: Check the screenshot lists
        run: python3 -I tools/manual-screenshots.py --selftest
      - name: Check feature coverage
        run: python3 -I tools/check-manual-coverage.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
