name: Trace build

# Builds the Windows GUI with the `trace` feature for latency measurements.
# GitHub starts a hand-dispatched run only from the default branch, so a push
# to a `trace-build/**` branch starts one as well.
on:
  workflow_dispatch:
  push:
    branches:
      - 'trace-build/**'

permissions:
  contents: read

jobs:
  windows:
    name: windows-trace
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Install Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the instrumented GUI
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p focusforge-gui --features trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash the executable
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/focusforge-gui.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  focusforge-gui.exe" | Set-Content -Encoding ascii "$exe.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: focusforge-gui-trace-windows
          path: |
            target/x86_64-pc-windows-msvc/release/focusforge-gui.exe
            target/x86_64-pc-windows-msvc/release/focusforge-gui.exe.sha256
          if-no-files-found: error
