# Stacking settings (docs/guide/stacking.md) and Alignment (docs/guide/alignment.md).
# The Settings panel has no scroll wheel under MCP, so shots that need the whole
# panel use a taller window instead of scrolling.

[[shot]]
name  = "stacking-tab-launch"
args  = ["--open", "fixtures/mantis-512/frames", "--dock-tab", "settings"]
size  = "1280x880"
steps = [["wait-text", "DEFAULT", "120"], ["wait-id", "FFResetAll::area"], ["pause", "800"]]
out   = "assets/manual/stacking/stacking-tab-launch.png"
crop  = "AppWindow::dock"

[[shot]]
name  = "stacking-fuse-picker"
args  = ["--open", "fixtures/mantis-512/frames", "--dock-tab", "settings"]
steps = [
  ["wait-text", "DEFAULT", "120"],
  ["click-id", "FFMenu::root", "0"],
  ["wait-id", "FFMenuList::option-area"],
  ["pause", "500"],
]
out   = "assets/manual/stacking/stacking-fuse-picker.png"
crop  = "FFDock::settings-panel"
pad   = 8

[[shot]]
name  = "stacking-soft-transitions"
args  = ["--open", "fixtures/mantis-512/frames", "--dock-tab", "settings"]
steps = [
  ["wait-text", "DEFAULT", "120"],
  ["click-id", "FFMenu::root", "0"],
  ["click-id", "FFMenuList::option-area", "1"],
  ["wait-text", "Sharp-source preference"],
  ["click-id", "FFMoreToggle::header-area", "1"],
  ["wait-text", "Radius"],
  ["pause", "500"],
]
out   = "assets/manual/stacking/stacking-soft-transitions.png"
crop  = "FFDock::settings-panel"
pad   = 8

