[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "vendor"]

[workspace.package]
version = "0.2.0-rc.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/jjjsood/FocusForge"

# Full debug info for wgpu/slint dominates target size; line tables keep backtraces.
[profile.dev]
debug = "line-tables-only"

# Dependencies build optimised; workspace crates keep the dev default, so
# product code stays debuggable. The full nextest run takes about 345 s
# instead of 572 s, and a clean build costs the same.
[profile.dev.package."*"]
debug = false
opt-level = 2

# Installers retain this same-build information only long enough for the
# platform packagers to extract native symbols.  Shipping copies are stripped.
[profile.release]
debug = "line-tables-only"
strip = "none"
split-debuginfo = "off"

# vendor/minidump-writer is minidump-writer 0.13.0 plus upstream commit
# 70311be21766 ("mach: read_string: don't read unreadable memory"). Without it
# a macOS crash dump of a process started with a small environment, such as
# from the Finder, lists the main executable with an empty name. Remove this
# patch and vendor/minidump-writer as soon as a minidump-writer release
# contains that commit.
[patch.crates-io]
minidump-writer = { path = "vendor/minidump-writer" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
ignore_without_reason = "deny"
