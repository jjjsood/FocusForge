[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0-rc.3"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/jjjsood/FocusForge"

# Full debug info for wgpu/slint dominates target size; line tables keep backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Installers retain this same-build information only long enough for the
# platform packagers to extract native symbols.  Shipping copies are stripped.
[profile.release]
debug = "line-tables-only"
strip = "none"
split-debuginfo = "off"

# cargo-dist generic archives are shipping outputs, not symbol containers.
[profile.dist]
inherits = "release"
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "deny"
