[package]
name = "focusforge-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
slint = { version = "~1.17", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-femtovg-wgpu", "unstable-wgpu-29",
    "unstable-winit-030",
] }
clap = { version = "4", features = ["derive"] }
png = "0.18"
thiserror = "2.0.20"
focusforge-core = { path = "../core" }
focusforge-diagnostics = { path = "../diagnostics" }
focusforge-gpu = { path = "../gpu", features = ["gpu"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
directories = "6"

[build-dependencies]
slint-build = "~1.17"

[dev-dependencies]
i-slint-backend-testing = "~1.17"
tempfile = "3"
