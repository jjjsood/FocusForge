[package]
name = "focusforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "focusforge-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
focusforge-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
