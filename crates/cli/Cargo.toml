[package]
name = "focusforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "focusforge-cli"
path = "src/main.rs"

[features]
default = ["gpu"]
gpu = ["dep:focusforge-gpu", "focusforge-gpu/gpu"]
gpu-tests = ["gpu"]

[dependencies]
clap = { version = "4", features = ["derive"] }
focusforge-core = { path = "../core" }
focusforge-gpu = { path = "../gpu", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
focusforge-core = { path = "../core", features = ["test-algorithms"] }
