[package]
name = "focusforge-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
test = false
doctest = false
# Without this, `--all-targets` compiles the 69 MB generated crate a second time
# as a bench target, and both rustc processes run together.
bench = false

[features]
# The Slint compiler emits per-element debug info, which element lookup by id
# reads.
element-debug-info = []

[dependencies]
slint = { version = "~1.17", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-femtovg-wgpu", "unstable-wgpu-29",
    "unstable-winit-030",
] }

[build-dependencies]
slint-build = "~1.17"
