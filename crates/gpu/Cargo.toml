[package]
name = "focusforge-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:thiserror"]
gpu-tests = ["gpu"]

[dependencies]
focusforge-core = { path = "../core" }
tracing = "0.1.44"
wgpu = { version = "29.0.4", optional = true }
thiserror = { version = "2.0.20", optional = true }

# `tests/harness/errors.rs` installs a capturing layer of its own. Product
# code in this crate raises events through the facade and never installs a
# subscriber.
[dev-dependencies]
tracing-subscriber = "0.3.23"
