# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
members = ["cargo:."]
packages = ["focusforge-cli", "focusforge-gui"]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
hosting = "github"
local-artifacts-jobs = ["./package-native"]
pr-run-mode = "upload"
# release.yml carries the Linux package smoke steps added by hand after generation.
allow-dirty = ["ci"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
installers = []
github-build-setup = "../build-setup.yml"
checksum = "sha256"
include = ["LICENSE", "NOTICE", "assets/focusforge.desktop", "assets/build/hicolor"]

[[dist.extra-artifacts]]
build = ["tools/package-linux.sh"]
artifacts = [".scratch/package-linux/FocusForge-0.1.0-x86_64.AppImage", ".scratch/package-linux/focusforge_0.1.0_amd64.deb", ".scratch/package-linux/artifacts.sha256", ".scratch/package-linux/inventory.txt", ".scratch/package-linux/symbols/FocusForge-0.1.0-x86_64-unknown-linux-gnu-symbols.tar.gz", ".scratch/package-linux/symbols/symbols.sha256", ".scratch/package-linux/symbols/symbol-inventory.json"]

[[dist.extra-artifacts]]
build = ["python3", "tools/collect-native-artifacts.py"]
artifacts = [".scratch/native-artifacts/FocusForge-0.1.0-aarch64.dmg", ".scratch/native-artifacts/FocusForge-0.1.0-x86_64.msi", ".scratch/native-artifacts/FocusForge-0.1.0-aarch64-apple-darwin-symbols.tar.gz", ".scratch/native-artifacts/FocusForge-0.1.0-x86_64-pc-windows-msvc-symbols.tar.gz", ".scratch/native-artifacts/native-artifacts.sha256", ".scratch/native-artifacts/native-artifacts.json"]

[dist.github-custom-runners]
global = "ubuntu-24.04"

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-24.04"

[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"swatinem/rust-cache" = "6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
