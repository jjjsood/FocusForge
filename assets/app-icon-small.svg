<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="ff-app-icon-small-title">
  <title id="ff-app-icon-small-title">FocusForge</title>

  <!-- Same ground, but the mark keeps its full size here: at 16 and 24 px every
       further inset costs a pixel the planes cannot spare. Small icons are drawn
       fuller than large ones on purpose. -->
  <rect width="32" height="32" rx="7" fill="#23303B"/>
  <g fill="#F2F4F6">
    <rect x="4" y="18" width="24" height="2"/>
    <rect x="8" y="22" width="16" height="2"/>
    <rect x="4" y="26" width="24" height="2"/>
  </g>
  <g fill="#E8763A" transform="rotate(-21.801 13 11.4)">
    <rect x="10.5" y="7.4" width="5" height="8"/>
    <rect x="15.5" y="10.4" width="8" height="2"/>
  </g>
</svg>
